[project]
name = "sheetbench"
version = "0.1.0"
description = "A minimal Buckeye environment"
requires-python = ">=3.11"
dependencies = [ "buckeye-python", "pyautogui", "playwright", "httpx", "typer", "google-api-python-client", "google-auth",]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
sheetbench = "controller.__main__:main"

[tool.buckeye]
image = "sheetbench:dev"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [ "src/controller",]
